name: Build Windows EXE

# Jalan otomatis saat kamu push tag versi (mis. v1.0.0),
# atau bisa dijalankan manual dari tab Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name MiniMITMProxy --add-data "plugins;plugins" app.py

      - name: Upload artifact (selalu, walau bukan tag)
        uses: actions/upload-artifact@v4
        with:
          name: MiniMITMProxy
          path: dist/MiniMITMProxy.exe

      - name: Create GitHub Release (hanya saat push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniMITMProxy.exe
          generate_release_notes: true
